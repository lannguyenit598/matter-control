# Public-key material only. Private key: secrets/system-user.pem (0600).
SystemAPIUsers:
  - mc-bootstrap:
      KeyData: 
      Memberships:
        - MemberType: System
          Roles:
            - "SYSTEM_OWNER"
            - "IAM_OWNER"
            - "ORG_OWNER"
# Machine provisioner must come from the config FILE: viper unmarshals only keys
# present in the loaded config map, so ZITADEL_FIRSTINSTANCE_ORG_MACHINE_* env vars
# alone do not populate Org.Machine (Org.LoginClient has a defaults.yaml entry and
# therefore works from env).
FirstInstance:
  PatPath: /zitadel/bootstrap/mc-provisioner.pat
  Org:
    Machine:
      Machine:
        Username: mc-provisioner
        Name: MC Provisioner
      Pat:
        ExpirationDate: 2099-01-01T00:00:00Z
