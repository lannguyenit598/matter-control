# sqlc generates typed query code for the postgres adapter. Regenerate with
# `make sqlc-generate`; `make sqlc-check` (part of `make check`) fails when the output is stale.
# Two independent jobs: sqlcgen serves the legacy userapi schema, mcsqlc serves the
# MatterControl product bundle. They share nothing: separate schema, queries, package.
version: "2"
sql:
  - engine: postgresql
    # The Goose migrations are the schema: sqlc applies their Up sections in file order and ignores
    # everything after "-- +goose Down". There is no separate schema file to maintain.
    schema: internal/adapter/outbound/postgres/migrations
    queries: internal/adapter/outbound/postgres/queries
    gen:
      go:
        package: sqlcgen
        out: internal/adapter/outbound/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          # IDs stay strings, like domain.UserID and outbox.Message.ID: PostgreSQL parses and
          # formats UUIDs, so the adapter does not convert them.
          - db_type: uuid
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
  - engine: postgresql
    # MatterControl product bundle: its own migration directory is the schema. Never mix
    # this schema with the legacy migrations or run either bundle against the other's database.
    schema: internal/adapter/outbound/postgres/migrations_mattercontrol
    queries: internal/adapter/outbound/postgres/queries_mattercontrol
    gen:
      go:
        package: mcsqlc
        out: internal/adapter/outbound/postgres/mcsqlc
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: string
          - db_type: timestamptz
            go_type: time.Time
          # Nullable columns surface as pgtype.*; the adapter converts at the boundary,
          # following the legacy job's convention.
