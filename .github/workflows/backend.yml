name: Backend

# Runs only when the backend (or this workflow) changes. Because of the path filter, make the checks
# required through a ruleset that allows "skipped" for pull requests that do not touch apps/backend.
on:
  push:
    branches: [main]
    paths: ["apps/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["apps/backend/**", ".github/workflows/backend.yml"]
  # Weekly on main: govulncheck catches newly disclosed vulnerabilities even without code changes.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/backend/go.sum
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: Generated queries are up to date (sqlc, no database)
        run: make sqlc-check
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: apps/backend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mattercontrol
          POSTGRES_PASSWORD: mattercontrol
          POSTGRES_DB: mattercontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mattercontrol -d mattercontrol"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Enables the PostgreSQL contract suites (each test creates and drops its own schema).
      MC_TEST_DATABASE_URL: postgres://mattercontrol:mattercontrol@localhost:5432/mattercontrol?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/backend/go.sum
      - name: Test (unit, HTTP, memory and PostgreSQL contract suites)
        run: |
          set -euo pipefail
          # Keep the existing contract database. This second instance is only for pgx verify-full.
          fixture=$(mktemp -d /tmp/mc-pg-tls.XXXXXX)
          tls_db=
          trap 'if [ -n "$tls_db" ]; then docker stop "$tls_db" >/dev/null || true; fi; rm -rf "$fixture"' EXIT
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -subj /CN=mc-ci-ca \
            -addext basicConstraints=critical,CA:TRUE -keyout "$fixture/ca.key" -out "$fixture/ca.pem"
          openssl req -new -newkey rsa:2048 -nodes -subj /CN=localhost \
            -keyout "$fixture/server.key" -out "$fixture/server.csr"
          openssl x509 -req -sha256 -days 1 -set_serial 1 -in "$fixture/server.csr" \
            -CA "$fixture/ca.pem" -CAkey "$fixture/ca.key" -out "$fixture/server.pem" \
            -extfile <(printf 'subjectAltName=DNS:localhost\n')
          tls_password=$(openssl rand -hex 16)
          tls_db=$(docker run --rm -d -p 127.0.0.1::5432 --entrypoint sh \
            -e POSTGRES_PASSWORD="$tls_password" \
            -v "$fixture/server.key:/fixture/server.key:ro" -v "$fixture/server.pem:/fixture/server.pem:ro" \
            postgres:18-alpine -ec '
              cp /fixture/server.key /fixture/server.pem /tmp/
              chown postgres:postgres /tmp/server.key
              chmod 600 /tmp/server.key
              exec docker-entrypoint.sh postgres -c ssl=on \
                -c ssl_cert_file=/tmp/server.pem -c ssl_key_file=/tmp/server.key
            ')
          binding=$(docker port "$tls_db" 5432/tcp)
          for attempt in {1..30}; do
            if docker exec "$tls_db" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$tls_db" pg_isready -h 127.0.0.1 -U postgres
          export MC_TLS_TEST_DATABASE_URL="postgres://postgres:$tls_password@localhost:${binding##*:}/postgres"
          export MC_TLS_TEST_CA_FILE="$fixture/ca.pem"
          go test -race -count=1 -json -coverprofile=coverage.out ./... | tee test.json
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      # Required PostgreSQL contract and TLS tests must execute.
      - name: No unexpected skips
        run: |
          python3 - <<'PY'
          import json, sys
          postgres = "adapter/outbound/postgres"
          allowed = {
              ("adapter/outbound/objectstore", "TestContract_R2_RealBucket"),  # Real provider.
              (postgres, "TestAccessPathExplainVerification"),  # Opt-in workload.
              (postgres, "TestPerf_LocalWorkloads"),  # Opt-in workload.
              (postgres, "TestRestoreRehearsal"),  # Separate recovery drill.
              (postgres + "/pgtest", "TestFreshSchemaDSNFrom_SkipsWithoutEnv/skip"),  # Self-test.
              # The transaction adapter has no memory-only step injection seam.
              (postgres, "TestMatterSuiteW6_Postgres/a_failure_inside_the_group_rolls_back_every_row;_a_retry_then_succeeds"),
          }
          skipped = []
          with open("test.json") as events:
              for line in events:
                  event = json.loads(line)
                  if event.get("Action") != "skip" or not event.get("Test"):
                      continue
                  package = event["Package"].split("/internal/", 1)[-1]
                  test = event["Test"]
                  if (package, test) not in allowed:
                      skipped.append(f"{package} :: {test}")
          if skipped:
              print("Unexpected skipped tests:", *skipped, sep="\n  ")
              sys.exit(1)
          print("No unexpected skips")
          PY
      # mcapi validates its whole configuration, so the migrate step gets non-secret placeholders;
      # migrate never reads the key file or contacts the identity provider.
      - name: Migrations apply cleanly and are idempotent
        env:
          MC_DATABASE_URL: ${{ env.MC_TEST_DATABASE_URL }}
          MC_OBJECT_DIR: ${{ runner.temp }}/objects
          MC_OIDC_ISSUER: https://idp.invalid
          MC_OIDC_INTROSPECTION_URL: https://idp.invalid/oauth/v2/introspect
          MC_OIDC_AUDIENCE: ci-placeholder
          MC_OIDC_API_KEY_FILE: /nonexistent/key.json
        run: |
          go run ./cmd/mcapi migrate
          go run ./cmd/mcapi migrate

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Same Go version as the production build image (Dockerfile): standard-library
          # vulnerabilities depend on the toolchain that actually builds the binary.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: apps/backend/go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg VERSION=${{ github.sha }} -t mcapi:ci .
