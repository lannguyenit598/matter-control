name: Frontend

# Runs only when the frontend (or this workflow) changes. See backend.yml for the required-check note.
on:
  push:
    branches: [main]
    paths: ["apps/frontend/**", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["apps/frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

# Least privilege for GITHUB_TOKEN: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/frontend

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # TODO(supply chain): pin the next three actions by commit SHA like the backend workflow.
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
        with:
          package_json_file: apps/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Runtime dependencies only: the known dev-only advisory (SEC-6) has no fix yet.
      - run: pnpm audit --prod
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm agents:check
      - run: pnpm test
      # The build script also verifies that Tailwind CSS was compiled (see package.json).
      - run: pnpm build
      - run: pnpm build-storybook

  e2e:
    name: E2E (Playwright, demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7
