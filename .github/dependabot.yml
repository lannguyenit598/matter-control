# Automatic dependency updates. Dependabot PRs must pass CI like every other PR.
# cooldown: propose releases at least 14 days old. Security updates are not held back by the cooldown.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned with version comments; Dependabot updates the pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
